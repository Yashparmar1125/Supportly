<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="supportly-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E34"/>
      <stop offset="100%" stop-color="#141424"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle with subtle brand stroke -->
  <rect width="32" height="32" rx="7.5" fill="url(#supportly-bg)" stroke="#5B4FE5" stroke-width="1.2" stroke-opacity="0.55"/>
  
  <!-- 's' character from brand typography -->
  <text x="7" y="22" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" letter-spacing="-0.03em">s</text>
  
  <!-- Signature electric indigo dot '.' -->
  <circle cx="22.5" cy="20.5" r="2.5" fill="#685BF5"/>
</svg>